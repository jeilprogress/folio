<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · Writing room</title>
<style>
:root{color-scheme:light;--bg:#f4f0e8;--panel:#fcf9f3;--paper:#fffcf6;--ink:#332b2a;--muted:#70635f;--line:#dbd3c8;--wine:#743145;--soft:#f0dce0;--wash:#eadfcd;--shadow:0 12px 46px #50361b08}
:root.dark{color-scheme:dark;--bg:#211e20;--panel:#2b2629;--paper:#302a2c;--ink:#f7ece6;--muted:#c6b4b1;--line:#514649;--wine:#edafbe;--soft:#503741;--wash:#443a34;--shadow:none}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px "DM Sans",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:transparent;border:0;border-radius:16px;padding:9px 13px}button:hover{background:var(--wash)}button:focus-visible,select:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,84px);background:var(--panel)}.brand{font:italic bold 37px Georgia;letter-spacing:-2.5px;display:flex;align-items:center;gap:11px}.mark{width:33px;height:36px;display:inline-block;position:relative}.mark:before,.mark:after{content:"";position:absolute;inset:5px 8px 4px 3px;border-radius:3px 8px 4px 2px;background:var(--wine);transform:rotate(-13deg)}.mark:after{transform:rotate(12deg);left:11px;right:1px;background:var(--soft);border:1px solid var(--wine)}.flex{display:flex;align-items:center;gap:8px}.pill,select{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:8px 14px}.shell{max-width:1450px;margin:0 auto;padding:36px clamp(16px,5vw,84px);display:grid;grid-template-columns:245px minmax(0,1fr);gap:28px}.rail{display:flex;flex-direction:column;gap:16px}.card,article{border:1px solid var(--line);background:var(--panel);border-radius:24px;box-shadow:var(--shadow)}.card{padding:20px}.label{font:600 10px system-ui;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h2{font:24px Georgia;margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.stories{width:100%;margin:15px 0 8px;min-width:0}.create{width:100%;background:var(--soft);color:var(--wine);font-weight:600}.sceneList{display:grid;gap:3px;margin-top:14px}.sceneList button{display:flex;gap:10px;text-align:left;align-items:baseline;overflow-wrap:anywhere}.sceneList small{font:11px monospace;color:var(--muted)}.selected{background:var(--soft);color:var(--wine)}.music{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--wash),var(--panel));padding-top:19px}.disc{width:80px;height:80px;margin:5px auto 14px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 2px,#46374219 3px 4px),conic-gradient(#a49daa,#ededed,#cba6b0,#aecec9,#ece2ba,#afacc0,#f6ddd2,#a49daa);box-shadow:2px 4px 8px #37232b26;display:grid;place-items:center;animation:turn 9s linear infinite;animation-play-state:paused}.disc:after{content:"";width:19%;height:19%;background:var(--panel);border:5px solid #be9da8;border-radius:100%}.playing{animation-play-state:running}@keyframes turn{to{transform:rotate(360deg)}}.music strong,.music small{display:block;overflow-wrap:anywhere}.music small{color:var(--muted);margin:4px 0 12px}.music button{width:100%}.work{min-width:0}.worktop{margin:4px 1px 18px}.crumb{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.status{font-size:12px;color:var(--muted)}article{background:var(--paper);overflow:hidden;min-height:65vh}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:3px;padding:12px 16px;border-bottom:1px solid var(--line)}.toolbar button{font-size:15px;min-width:36px;padding:7px 10px}.align{width:16px;height:14px;display:inline-flex;flex-direction:column;justify-content:space-between;vertical-align:middle}.align i{width:100%;height:1.5px;background:currentColor}.align i:nth-child(2n){width:65%}.center{align-items:center}.right{align-items:flex-end}.justify i:nth-child(n){width:100%}.sep{height:20px;border-left:1px solid var(--line);margin:0 5px}.copy{margin-left:auto}.sheet{max-width:840px;margin:auto;padding:clamp(24px,5vw,72px)}#title{display:block;width:100%;border:0;background:none;font:clamp(32px,4vw,54px) Georgia;letter-spacing:-1.6px;margin:12px 0 25px;padding:0}#editor{min-height:35vh;font:20px/1.75 Georgia,serif;overflow-wrap:anywhere;outline:none}#editor:empty:before{content:attr(data-hint);color:var(--muted);font-style:italic;pointer-events:none}#editor p{margin:0 0 .7em}footer{padding:15px 4px;color:var(--muted);font-size:13px}.focused .rail,.focused .crumb{display:none}.focused .shell{grid-template-columns:minmax(0,940px);justify-content:center}.quiet{color:var(--muted);font-size:13px}dialog{width:min(430px,92vw);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:28px}dialog::backdrop{background:#21151c60;backdrop-filter:blur(4px)}dialog input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;margin:10px 0}dialog p{line-height:1.5;overflow-wrap:anywhere}dialog a{color:var(--wine)}.primary{background:var(--soft);color:var(--wine)}button[aria-pressed=true]{background:var(--soft);color:var(--wine)}#mobile{display:none}#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:18px;padding:9px 16px;z-index:5;text-align:center}button,.card{transition:background .18s,transform .18s}button:active{transform:scale(.96)}@media(max-width:790px){header{height:62px}.shell{display:block;padding:17px 12px}.rail{display:none;margin-bottom:16px}.openRail .rail{display:grid}.focused .rail{display:none}#mobile{display:inline-block}.sheet{padding:28px 20px}.toolbar{padding:8px;gap:0}.toolbar button{min-width:30px;padding:6px}.brand{font-size:30px}.music .disc{float:right}.worktop{margin:0 4px 12px}.copy{font-size:12px!important}.sep{margin:0 2px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true"></span>Folio</div><div class="flex"><button id="mobile" class="pill">Stories</button><button class="pill" id="focusMode" aria-pressed="false">Focus</button><button class="pill" id="theme" aria-label="Switch theme">☾</button></div></header>
<main class="shell"><aside class="rail"><section class="card"><h2>Story shelf</h2><select id="stories" class="stories" aria-label="Current story"></select><button class="create" id="create">＋ Create story</button></section>
<section class="card"><div class="row"><h2>Scenes</h2><button id="addScene" aria-label="Add scene">＋</button></div><nav class="sceneList" id="scenes" aria-label="Scenes"></nav></section>
<section class="card music"><div class="label">Soundtrack</div><div class="disc" id="disc"></div><strong id="track">Quiet room</strong><small id="artist">Spotify is disconnected</small><button class="pill" id="spotify">Connect Spotify</button><a id="trackLink" hidden target="_blank" rel="noopener">Open in Spotify ↗</a></section></aside>
<section class="work"><div class="row worktop"><span id="crumb" class="crumb"></span><span class="status" id="saved"></span></div><article><div class="toolbar" id="tools" role="group" aria-label="Text formatting"><button data-cmd="bold" title="Bold (Ctrl/⌘ B)" aria-label="Bold"><b>B</b></button><button data-cmd="italic" title="Italic (Ctrl/⌘ I)" aria-label="Italic"><i>I</i></button><button data-cmd="underline" title="Underline" aria-label="Underline"><u>U</u></button><span class="sep"></span><span id="alignTools" class="flex" style="gap:0"></span><span class="sep"></span><button id="breakBtn" title="Insert a time skip" aria-label="Insert a time skip">⁂</button><button id="copy" class="copy pill">Copy scene</button></div>
<div class="sheet"><div class="label" id="number"></div><input id="title" aria-label="Scene title" placeholder="Untitled scene"><div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Scene text" data-hint="Start with one line…" spellcheck="true"></div></div></article>
<footer class="row"><span id="count"></span><button class="quiet" id="backups">Backups</button></footer></section></main>
<dialog id="modal"><form id="form"><h2 id="heading"></h2><p id="detail"></p><input id="field" aria-labelledby="heading" autocomplete="off"><div id="extra"></div><div class="flex" style="justify-content:flex-end;margin-top:16px"><button type="button" id="close">Close</button><button id="submit" class="primary">Save</button></div></form></dialog><div id="toast" hidden role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), ed=$('editor'), modal=$('modal'), uid=()=>crypto.randomUUID(), key='folio.workspace.v1:'+location.pathname;
function freshScene(title='Opening scene'){return {id:uid(),title,html:''}}
function freshStory(name){return {id:uid(),name,scenes:[freshScene()]}}
const seed=freshStory('My first story');
let data={stories:[seed],story:seed.id,scene:seed.scenes[0].id}, readError=false;
function valid(d){return d&&Array.isArray(d.stories)&&d.stories.length&&d.stories.every(s=>typeof s.name==='string'&&typeof s.id==='string'&&Array.isArray(s.scenes)&&s.scenes.length&&s.scenes.every(x=>typeof x.id==='string'&&typeof x.title==='string'&&typeof x.html==='string'))}
try{const raw=localStorage.getItem(key);if(raw){const d=JSON.parse(raw);if(!valid(d))throw Error();data=d}}catch{readError=true}
const story=()=>data.stories.find(x=>x.id===data.story)||data.stories[0], scene=()=>story().scenes.find(x=>x.id===data.scene)||story().scenes[0];
let base;try{base=localStorage.getItem(key)}catch{}
function save(){try{if(readError||localStorage.getItem(key)!==base)throw Error();const value=JSON.stringify(data);localStorage.setItem(key,value);base=value;$('saved').textContent='● Saved on this device'}catch{$('saved').textContent='Unsaved · export a backup'}}
function notice(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').hidden=true,4200)}
function count(){const n=(ed.innerText.match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length;$('count').textContent=n+' word'+(n===1?'':'s')}
function nav(){const s=story();$('stories').replaceChildren(...data.stories.map(v=>new Option(v.name,v.id,false,v.id===s.id)));$('crumb').textContent='Story shelf  /  '+s.name;$('scenes').replaceChildren(...s.scenes.map((v,i)=>{const b=document.createElement('button'),n=document.createElement('small');n.textContent=String(i+1).padStart(2,'0');b.append(n,v.title||'Untitled scene');if(v===scene())b.className='selected';b.onclick=()=>{data.scene=v.id;render();save();document.body.classList.remove('openRail')};return b}))}
function render(){nav();$('number').textContent='Scene '+String(story().scenes.indexOf(scene())+1).padStart(2,'0');$('title').value=scene().title;ed.innerHTML=scene().html;count();updateTools()}
$('title').oninput=()=>{scene().title=$('title').value;nav();save()};ed.oninput=()=>{scene().html=ed.innerHTML;count();save()};$('stories').onchange=e=>{data.story=e.target.value;data.scene=story().scenes[0].id;render();save()};
function dialog(title,detail,label,initial,action){$('heading').textContent=title;$('detail').textContent=detail;$('extra').replaceChildren();$('field').hidden=initial===null;$('field').placeholder='';$('field').value=initial||'';$('field').required=initial!==null;$('submit').textContent=label;$('submit').hidden=!action;$('form').onsubmit=e=>{e.preventDefault();if(action){const value=$('field').value.trim();if(initial!==null&&!value)return;modal.close();action(value)}};modal.showModal();if(initial!==null){$('field').focus();$('field').select()}}
$('close').onclick=()=>modal.close();$('create').onclick=()=>dialog('Create story','Give this story a working title.','Create','',name=>{const s=freshStory(name);data.stories.push(s);data.story=s.id;data.scene=s.scenes[0].id;render();save();ed.focus()});$('addScene').onclick=()=>dialog('New scene','Each scene gets its own writing space.','Add scene','Scene '+(story().scenes.length+1),name=>{const s=freshScene(name);story().scenes.push(s);data.scene=s.id;render();save();ed.focus()});
let dark=matchMedia('(prefers-color-scheme: dark)').matches;try{dark=(localStorage.getItem('folio.theme')||String(dark))==='true'}catch{}function theme(){document.documentElement.classList.toggle('dark',dark);$('theme').textContent=dark?'☀':'☾'}theme();$('theme').onclick=()=>{dark=!dark;theme();try{localStorage.setItem('folio.theme',dark)}catch{}};$('mobile').onclick=()=>{document.body.classList.remove('focused');$('focusMode').setAttribute('aria-pressed','false');document.body.classList.toggle('openRail')};$('focusMode').onclick=()=>{const on=document.body.classList.toggle('focused');$('focusMode').setAttribute('aria-pressed',on);ed.focus()};
for(const [label,cmd] of [['left','justifyLeft'],['center','justifyCenter'],['right','justifyRight'],['justify','justifyFull']]){const b=document.createElement('button');b.dataset.cmd=cmd;b.title=b.ariaLabel='Align '+label;b.innerHTML='<span class="align '+label+'"><i></i><i></i><i></i><i></i></span>';$('alignTools').append(b)}
function updateTools(){for(const b of document.querySelectorAll('[data-cmd]'))b.setAttribute('aria-pressed',String(ed.contains(getSelection()?.anchorNode)&&document.queryCommandState(b.dataset.cmd)))}
document.addEventListener('selectionchange',updateTools);$('tools').onmousedown=e=>e.preventDefault();
$('tools').onclick=e=>{const cmd=e.target.closest('[data-cmd]')?.dataset.cmd;if(cmd){ed.focus();document.execCommand(cmd);updateTools()}};
$('breakBtn').onclick=()=>{ed.focus();document.execCommand('insertHTML',false,'<p style="text-align:center">⁂</p><p><br></p>')};
ed.addEventListener('beforeinput',e=>{if(e.inputType!=='insertText'||e.isComposing||!["'",'"'].includes(e.data))return;const sel=getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0).cloneRange();const block=r.startContainer.parentElement?.closest('p,div,li,blockquote')||ed;r.setStart(block,0);const opening=!r.toString()||/[\s([{—]$/u.test(r.toString());e.preventDefault();document.execCommand('insertText',false,e.data==="'"?(opening?'‘':'’'):(opening?'“':'”'))});
</script>
<script>
const escapeHtml=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function clean(html){
 const src=document.createElement('template');src.innerHTML=html;
 const blocks=new Set('P DIV ARTICLE SECTION MAIN HEADER FOOTER BLOCKQUOTE H1 H2 H3 H4 H5 H6 UL OL LI PRE'.split(' '));
 function visit(n,pre=false){
  if(n.nodeType===3){const text=escapeHtml(n.data);return pre?text.replace(/\r?\n/g,'<br>'):text}
  if(n.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|IMG|BUTTON|INPUT|SVG|MATH|TEMPLATE|NOSCRIPT)$/.test(n.tagName))return '';
  if(n.tagName==='BR')return '<br>';
  const st=n.style;let inner=Array.from(n.childNodes,c=>visit(c,pre||n.tagName==='PRE'||/^pre/.test(st.whiteSpace))).join('');
  if(/^(B|STRONG)$/.test(n.tagName)||st.fontWeight==='bold'||parseInt(st.fontWeight)>=600)inner='<strong>'+inner+'</strong>';
  if(/^(I|EM)$/.test(n.tagName)||st.fontStyle==='italic')inner='<em>'+inner+'</em>';
  if(n.tagName==='U'||(st.textDecoration+st.textDecorationLine).includes('underline'))inner='<u>'+inner+'</u>';
  if(blocks.has(n.tagName)){const t=/^(ARTICLE|SECTION|MAIN|HEADER|FOOTER)$/.test(n.tagName)?'div':n.tagName.toLowerCase();const align=st.textAlign||n.getAttribute('align');return '<'+t+(/^(left|right|center|justify)$/.test(align)?' style="text-align:'+align+'"':'')+'>'+inner+'</'+t+'>'}
  return inner
 }
 return Array.from(src.content.childNodes,n=>visit(n)).join('')
}
function plainRich(s){return s.replace(/\r\n?/g,'\n').split('\n').map(line=>{let html=escapeHtml(line).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');return '<div>'+(html||'<br>')+'</div>'}).join('')}
ed.onpaste=e=>{e.preventDefault();const c=e.clipboardData;const h=c.getData('text/html');document.execCommand('insertHTML',false,h?clean(h):plainRich(c.getData('text/plain')))};
ed.ondrop=e=>e.preventDefault();
$('copy').onclick=async()=>{if(!ed.innerText.trim()){notice('This scene is empty');return}try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([clean(ed.innerHTML)],{type:'text/html'}),'text/plain':new Blob([ed.innerText],{type:'text/plain'})})]);notice('Scene copied with formatting')}catch{ed.focus();const r=document.createRange();r.selectNodeContents(ed);getSelection().removeAllRanges();getSelection().addRange(r);notice(document.execCommand('copy')?'Scene copied':'Scene selected · press Ctrl/Cmd+C')}};
function download(){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.href=url;a.download='folio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('backups').onclick=()=>{dialog('Story backups','Drafts live in this browser. Download all stories or import a backup as additional stories.', '',null,null);const down=document.createElement('button');down.type='button';down.className='pill';down.textContent='Download backup';down.onclick=download;const input=document.createElement('input');input.type='file';input.accept='.json';input.ariaLabel='Import backup';input.onchange=async()=>{try{const d=JSON.parse(await input.files[0].text());if(!valid(d))throw Error();const items=d.stories.map(s=>({id:uid(),name:s.name,scenes:s.scenes.map(x=>({id:uid(),title:x.title,html:clean(x.html)}))}));data.stories.push(...items);data.story=items[0].id;data.scene=items[0].scenes[0].id;render();save();modal.close();notice('Backup imported')}catch{notice('Could not read this backup')}};$('extra').append(down,input)};
render();$('saved').textContent=readError?'Storage unavailable · use Backups':'● Saved on this device';
</script><script>
const redirect=location.origin+location.pathname, api='https://api.spotify.com/v1/me/player/currently-playing', tokenURL='https://accounts.spotify.com/api/token', sessionKey='folio.spotify:'+location.pathname;
let session={};try{session=JSON.parse(sessionStorage.getItem(sessionKey)||'{}')}catch{}
function persist(){sessionStorage.setItem(sessionKey,JSON.stringify(session))}
function music(name,by,playing=false,url=''){ $('track').textContent=name;$('artist').textContent=by;$('disc').classList.toggle('playing',playing);$('trackLink').hidden=!url;if(url)$('trackLink').href=url;$('spotify').textContent=session.access?'Disconnect Spotify':'Connect Spotify'}
const enc=bytes=>btoa(String.fromCharCode(...bytes)).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
$('spotify').onclick=()=>{if(session.access){session={};persist();clearTimeout(pollTimer);music('Quiet room','Spotify is disconnected');return}
 if(location.protocol!=='https:'&&location.hostname!=='127.0.0.1'){dialog('Connect Spotify','Open Folio on its HTTPS GitHub Pages address to connect.','',null,null);return}
 dialog('Connect Spotify','In your Spotify developer dashboard, create a Web API app and register the exact redirect address below. Enter its public Client ID here. Development-mode app owners need Spotify Premium.','Connect','',async id=>{try{if(!/^[a-f\d]{32}$/i.test(id)){notice('Enter the 32-character Client ID');return}const verifier=enc(crypto.getRandomValues(new Uint8Array(48))),state=uid(),challenge=enc(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))));session={id,verifier,state};persist();location.assign('https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:id,response_type:'code',scope:'user-read-currently-playing',redirect_uri:redirect,state,code_challenge_method:'S256',code_challenge:challenge}))}catch{notice('Spotify setup needs browser session storage')}});$('field').placeholder='Client ID';const p=document.createElement('p');p.textContent=redirect;const a=document.createElement('a');a.href='https://developer.spotify.com/dashboard';a.target='_blank';a.rel='noopener';a.textContent='Open Spotify dashboard ↗';$('extra').append(p,a)};
async function token(params){const current=session;const response=await fetch(tokenURL,{method:'POST',body:new URLSearchParams({...params,client_id:current.id})});if(!response.ok)throw Error('authorization');const t=await response.json();if(session!==current)return;Object.assign(session,{access:t.access_token,refresh:t.refresh_token||session.refresh,expires:Date.now()+t.expires_in*1000});delete session.verifier;delete session.state;persist()}
let pollTimer=0;
async function poll(){clearTimeout(pollTimer);if(!session.access||document.hidden)return;let delay=12000;const current=session;try{if(Date.now()>session.expires-30000)await token({grant_type:'refresh_token',refresh_token:session.refresh});if(session!==current)return;const r=await fetch(api,{headers:{Authorization:'Bearer '+session.access}});if(session!==current)return;
 if(r.status===204)music('Nothing playing','Start a track in Spotify');else if(r.status===429){delay=Math.max(30,Number(r.headers.get('Retry-After'))||30)*1000;music('Taking a moment','Spotify asked us to retry later')}else if(r.status===403){music('Access unavailable','Check Premium and app user access');return}else if(r.status===401)throw Error('authorization');else if(!r.ok)throw Error('network');else{const x=await r.json();if(session!==current)return;music(x.item?.name||'Nothing playing',x.item?.artists?.map(a=>a.name).join(', ')||'Spotify',!!(x.item&&x.is_playing),x.item?.external_urls?.spotify)}}catch(e){if(session!==current)return;if(e.message==='authorization'){session={};persist();music('Reconnect Spotify','Your authorization expired');return}music('Spotify unavailable','Trying again shortly');delay=30000}if(session===current)pollTimer=setTimeout(poll,delay)}
async function initMusic(){const q=new URLSearchParams(location.search);if(q.has('code')||q.has('error')){history.replaceState(null,'',location.pathname+location.hash);try{if(q.has('error')||!session.state||q.get('state')!==session.state)throw Error();await token({grant_type:'authorization_code',code:q.get('code'),redirect_uri:redirect,code_verifier:session.verifier})}catch{session={};persist();music('Connection incomplete','Connect again when ready');return}}if(session.access)await poll()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(pollTimer);else poll()});initMusic();
</script></body></html>
