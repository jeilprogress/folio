<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · Writing room</title>
<style>
:root{color-scheme:light;--bg:#f4f0e8;--panel:#fcf9f3;--paper:#fffcf6;--ink:#332b2a;--muted:#70635f;--line:#dbd3c8;--wine:#743145;--soft:#f0dce0;--wash:#eadfcd;--shadow:0 12px 46px #50361b08}

*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px "DM Sans",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:transparent;border:0;border-radius:16px;padding:9px 13px}button:hover{background:var(--wash)}button:focus-visible,select:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,84px);background:var(--panel)}.brand{font:italic bold 37px Georgia;letter-spacing:-2.5px;display:flex;align-items:center;gap:11px}.mark{width:33px;height:36px;display:inline-block;position:relative}.mark:before,.mark:after{content:"";position:absolute;inset:5px 8px 4px 3px;border-radius:3px 8px 4px 2px;background:var(--wine);transform:rotate(-13deg)}.mark:after{transform:rotate(12deg);left:11px;right:1px;background:var(--soft);border:1px solid var(--wine)}.flex{display:flex;align-items:center;gap:8px}.pill,select{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:8px 14px}.shell{max-width:1450px;margin:0 auto;padding:36px clamp(16px,5vw,84px);display:grid;grid-template-columns:245px minmax(0,1fr);gap:28px}.rail{display:flex;flex-direction:column;gap:16px}.card,article{border:1px solid var(--line);background:var(--panel);border-radius:24px;box-shadow:var(--shadow)}.card{padding:20px}.label{font:600 10px system-ui;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h2{font:24px Georgia;margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.stories{width:100%;margin:15px 0 8px;min-width:0}.create{width:100%;background:var(--soft);color:var(--wine);font-weight:600}.sceneList{display:grid;gap:3px;margin-top:14px}.sceneList button{display:flex;gap:10px;text-align:left;align-items:baseline;overflow-wrap:anywhere}.sceneList small{font:11px monospace;color:var(--muted)}.selected{background:var(--soft);color:var(--wine)}.music{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--wash),var(--panel));padding-top:19px}.disc{width:80px;height:80px;margin:5px auto 14px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 2px,#46374219 3px 4px),conic-gradient(#a49daa,#ededed,#cba6b0,#aecec9,#ece2ba,#afacc0,#f6ddd2,#a49daa);box-shadow:2px 4px 8px #37232b26;display:grid;place-items:center;animation:turn 9s linear infinite;animation-play-state:paused}.disc:after{content:"";width:19%;height:19%;background:var(--panel);border:5px solid #be9da8;border-radius:100%}.playing{animation-play-state:running}@keyframes turn{to{transform:rotate(360deg)}}.music strong,.music small{display:block;overflow-wrap:anywhere}.music small{color:var(--muted);margin:4px 0 12px}.music button{width:100%}.work{min-width:0}.worktop{margin:4px 1px 18px}.crumb{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.status{font-size:12px;color:var(--muted)}article{background:var(--paper);overflow:hidden;min-height:65vh}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:3px;padding:12px 16px;border-bottom:1px solid var(--line)}.toolbar button{font-size:15px;min-width:36px;padding:7px 10px}.align{width:16px;height:14px;display:inline-flex;flex-direction:column;justify-content:space-between;vertical-align:middle}.align i{width:100%;height:1.5px;background:currentColor}.align i:nth-child(2n){width:65%}.center{align-items:center}.right{align-items:flex-end}.justify i:nth-child(n){width:100%}.sep{height:20px;border-left:1px solid var(--line);margin:0 5px}.copy{margin-left:auto}.sheet{max-width:840px;margin:auto;padding:clamp(24px,5vw,72px)}#title{display:block;width:100%;border:0;background:none;font:clamp(32px,4vw,54px) Georgia;letter-spacing:-1.6px;margin:12px 0 25px;padding:0}#editor{min-height:35vh;font:20px/1.75 Georgia,serif;overflow-wrap:anywhere;outline:none}#editor:empty:before{content:attr(data-hint);color:var(--muted);font-style:italic;pointer-events:none}#editor p{margin:0 0 .7em}footer{padding:15px 4px;color:var(--muted);font-size:13px}.focused .rail,.focused .crumb{display:none}.focused .shell{grid-template-columns:minmax(0,940px);justify-content:center}.quiet{color:var(--muted);font-size:13px}dialog{width:min(430px,92vw);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:28px}dialog::backdrop{background:#21151c60;backdrop-filter:blur(4px)}dialog input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;margin:10px 0}dialog p{line-height:1.5;overflow-wrap:anywhere}dialog a{color:var(--wine)}.primary{background:var(--soft);color:var(--wine)}button[aria-pressed=true]{background:var(--soft);color:var(--wine)}#mobile{display:none}#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:18px;padding:9px 16px;z-index:5;text-align:center}button,.card{transition:background .18s,transform .18s}button:active{transform:scale(.96)}@media(max-width:790px){header{height:62px}.shell{display:block;padding:17px 12px}.rail{display:none;margin-bottom:16px}.openRail .rail{display:grid}.focused .rail{display:none}#mobile{display:inline-block}.sheet{padding:28px 20px}.toolbar{padding:8px;gap:0}.toolbar button{min-width:30px;padding:6px}.brand{font-size:30px}.music .disc{float:right}.worktop{margin:0 4px 12px}.copy{font-size:12px!important}.sep{margin:0 2px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
:root{--glass:rgba(255,253,251,.68);--edge:#ffffffbf;--glow:#c4d8db;--bloom:#e8cdd9}
:root.dark{--glass:rgba(43,38,47,.77);--edge:#ffffff24;--glow:#293940;--bloom:#442e40}
body{min-height:100svh;background:radial-gradient(ellipse at 5% 10%,var(--bloom),transparent 55%),radial-gradient(ellipse at 95% 85%,var(--glow),transparent 58%),var(--bg);background-attachment:fixed}
.glass,[popover],dialog,.storyTile{background:var(--glass);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);border:1px solid var(--edge);box-shadow:inset 0 1px 1px #ffffff60,0 9px 32px #36283b0c}
header{background:transparent;border:0}.landing{max-width:900px;margin:clamp(48px,10vh,110px) auto;padding:0 24px}.landing h1{font:clamp(40px,7vw,72px)/1.1 Georgia,serif;letter-spacing:-.055em;margin:0}.landing>.row{flex-wrap:wrap}.create{width:auto;border-radius:32px;padding:12px 20px;background:var(--wine);color:var(--paper)}.create:hover{background:var(--ink)}
.shelfList{margin-top:32px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.storyTile{position:relative;display:flex;align-items:center;gap:8px;text-align:left;padding:10px 14px;border-radius:23px;overflow-wrap:anywhere}.storyTile strong{display:block;font:24px Georgia,serif;margin-bottom:10px}.storyTile small{color:var(--muted)}
.writer{min-height:100svh;padding:clamp(84px,12vh,128px) 22px 85px}.writer #editor{max-width:690px;margin:auto;min-height:68svh;outline:0;caret-color:var(--wine)}.writer #editor:empty:before{content:none}
.roomNav{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));z-index:1;display:flex;gap:5px;border-radius:32px;padding:4px}.roomNav button{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center}.hamb{display:grid;gap:4px;width:16px}.hamb i{height:1.5px;background:currentColor}.typeIcon{font:18px Georgia}
[popover]{position:fixed;inset:auto;color:var(--ink);border-radius:20px;padding:18px;margin:0;max-height:75svh;overflow:auto}#drawer,#tools{top:72px;left:16px;max-width:calc(100vw - 32px)}#drawer{width:270px}#tools:not(:popover-open){display:none}#drawer h2{margin:16px 0 4px}.sceneList{margin:8px 0}.roomStats{color:var(--muted);font-size:12px;margin:14px 0 0}.soundPanel{right:16px;bottom:73px;width:240px}.soundPanel small,.soundPanel a{display:block;margin:6px 0 10px;color:var(--muted)}.soundPanel button{margin-top:10px}.sceneList .selected{background:var(--soft)}

#editor{font-size:var(--writing-size,20px)}#editor p{margin:0}
#miniPlayer{position:fixed;z-index:2;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:248px;max-width:calc(100vw - 24px);padding:13px 14px 8px;border-radius:22px;box-shadow:inset 0 1px 1px var(--edge),0 8px 28px #261a2b18}
.playerTop{display:flex;align-items:center;gap:10px}
#grip{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0;text-align:left;touch-action:none;cursor:grab;user-select:none;border-radius:8px}
#grip:hover{background:transparent}#grip:active{cursor:grabbing;transform:none}
.artTile{position:relative;display:grid;place-items:center;flex:0 0 44px;height:44px;border-radius:5px;overflow:hidden;background:linear-gradient(145deg,var(--soft),var(--wash));color:var(--wine)}
.artTile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.songText{display:grid;min-width:0;gap:2px}.songText>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#track{font-size:14px;line-height:1.3}#artist{font-size:12px;color:var(--muted)}
#miniPlayer svg{width:19px;height:19px;fill:currentColor;display:block}
.playerMenu,.transportRow button{display:grid;place-items:center;padding:0;width:34px;height:34px;border-radius:50%}
.playerMenu{margin-left:auto}.transportRow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:3px}
.transportRow #playTrack{width:38px;height:38px;background:var(--soft);color:var(--wine)}
#transport{margin-top:12px}.timeRow{display:flex;justify-content:space-between;color:var(--muted);font:10px/1.25 system-ui;font-variant-numeric:tabular-nums}
.timeline{height:3px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:4px}.timeline i{display:block;height:100%;width:0;background:var(--wine);border-radius:inherit}
#miniPlayer:has(#transport[hidden]){width:216px;padding-bottom:13px}
#count{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:3;border-radius:999px;padding:7px 13px;font:500 12px/1.4 system-ui;font-variant-numeric:tabular-nums;color:var(--ink);pointer-events:none}
@media(max-width:420px){#miniPlayer{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 38px);width:220px}.writer{padding-bottom:212px}}
.sizeChoice{font-size:13px;padding:5px}
.openStory{min-width:0;flex:1;text-align:left;padding:10px;border-radius:12px;overflow-wrap:anywhere}.storyGrip,.storyOptions{flex:none;min-width:38px;min-height:42px;color:var(--muted)}.storyGrip{touch-action:none;user-select:none;cursor:grab;font-size:20px}.storyGrip:active{cursor:grabbing}.storyTile.dragSource{opacity:.6}.dropBefore:before,.dropAfter:after{content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:4px;background:var(--wine)}.dropBefore:before{top:-8px}.dropAfter:after{bottom:-8px}.storyActions{width:140px;padding:5px;border-radius:15px}.storyActions button{width:100%;text-align:left;padding:9px 12px}.storyGrip,.storyOptions{display:grid;place-items:center;padding:0;width:40px;height:42px}.storyGrip span{display:block;width:12px;height:18px;background:radial-gradient(circle,currentColor 1.6px,transparent 2px) 0 0/6px 6px}.storyOptions span{display:block;width:18px;height:6px;background:radial-gradient(circle,currentColor 1.6px,transparent 2px) 0 0/6px 6px}.danger{color:var(--wine)}
</style></head><body>
<div id="home"><header><div class="brand"><span class="mark" aria-hidden="true"></span>Folio</div><div class="flex"><button id="backups" class="glass">Backups</button><button id="theme" class="glass" aria-label="Switch theme">☾</button></div></header>
<main class="landing"><div class="row"><h1>Your stories</h1><button id="create" class="create">＋ Create story</button></div><div id="shelf" class="shelfList"></div></main></div>
<main id="room" class="writer" hidden><nav class="roomNav glass"><button popovertarget="drawer" aria-label="Open scenes and story navigation"><span class="hamb" aria-hidden="true"><i></i><i></i><i></i></span></button><button id="formatToggle" class="typeIcon" popovertarget="tools" aria-label="Text formatting">Aa</button><button id="roomTheme" aria-label="Switch theme">☾</button></nav>
<aside id="drawer" popover><button id="homeBtn">← Story shelf</button><h2 id="currentStory"></h2><div class="row"><span class="label">Scenes</span><button id="addScene" aria-label="Add scene">＋</button></div><nav id="scenes" class="sceneList" aria-label="Scenes"></nav><button id="rename" class="quiet">Rename scene</button><p class="roomStats"><span id="saved"></span></p></aside>
<div class="toolbar" id="tools" popover role="group" aria-label="Text formatting"><button data-cmd="bold" title="Bold (Ctrl/⌘ B)" aria-label="Bold"><b>B</b></button><button data-cmd="italic" title="Italic (Ctrl/⌘ I)" aria-label="Italic"><i>I</i></button><button data-cmd="underline" title="Underline" aria-label="Underline"><u>U</u></button><span class="sep"></span><span id="alignTools" class="flex" style="gap:0"></span><span class="sep"></span><button id="breakBtn" title="Insert a time skip" aria-label="Insert a time skip">⁂</button><select id="writingSize" class="sizeChoice" aria-label="Writing text size"><option>14</option><option>16</option><option>18</option><option selected>20</option><option>22</option><option>24</option><option>28</option><option>32</option></select><button id="copy" class="copy pill">Copy scene</button></div>
<div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Scene text" spellcheck="true"></div><span id="count" class="glass">0 words</span></main>
<section id="miniPlayer" class="glass" aria-label="Spotify player">
<div class="playerTop"><button id="grip" title="Drag to move or use arrow keys" aria-label="Move Spotify player with arrow keys"><span class="artTile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4v12a3 3 0 1 0 2 2V8l8-2v8a3 3 0 1 0 2 2V2z"/></svg><img id="cover" hidden alt=""></span><span class="songText"><strong id="track">Spotify</strong><small id="artist">Disconnected</small></span></button><button class="playerMenu" popovertarget="soundPanel" aria-label="Spotify options"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm8 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm8 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg></button></div>
<div id="transport" hidden><div class="timeRow"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="timeline" aria-hidden="true"><i id="progressFill"></i></div><div class="transportRow"><button id="prevTrack" aria-label="Previous track" title="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h3v14H4z M19 5.5a.8.8 0 0 0-1.2-.7L8 11.3a.85.85 0 0 0 0 1.4l9.8 6.5a.8.8 0 0 0 1.2-.7z"/></svg></button><button id="playTrack" aria-label="Play" title="Play"><svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 4.8a1.2 1.2 0 0 1 1.8-1l12.4 7.2a1.2 1.2 0 0 1 0 2L7.8 20.2a1.2 1.2 0 0 1-1.8-1z"/></svg><svg style="display:none" id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 4h4v16H6z M14 4h4v16h-4z"/></svg></button><button id="nextTrack" aria-label="Next track" title="Next track"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 5h3v14h-3z M5 5.5a.8.8 0 0 1 1.2-.7l9.8 6.5a.85.85 0 0 1 0 1.4l-9.8 6.5a.8.8 0 0 1-1.2-.7z"/></svg></button></div></div></section>
<aside id="soundPanel" popover class="soundPanel"><div class="label">Spotify</div><a id="trackLink" hidden target="_blank" rel="noopener">Open in Spotify ↗</a><button class="pill" id="spotify">Connect Spotify</button></aside>
<dialog id="modal"><form id="form"><h2 id="heading"></h2><p id="detail"></p><input id="field" aria-labelledby="heading" autocomplete="off"><div id="extra"></div><div class="flex" style="justify-content:flex-end;margin-top:16px"><button type="button" id="close">Close</button><button id="submit" class="primary">Save</button></div></form></dialog><div id="toast" hidden role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), ed=$('editor'), modal=$('modal'), uid=()=>crypto.randomUUID(), key='folio.workspace.v1:'+location.pathname;
function freshScene(title=''){return {id:uid(),title,html:''}}
function freshStory(name){return {id:uid(),name,scenes:[freshScene()]}}
let data={stories:[],story:null,scene:null}, readError=false;
function valid(d){return d&&Array.isArray(d.stories)&&d.stories.every(s=>typeof s.name==='string'&&typeof s.id==='string'&&Array.isArray(s.scenes)&&s.scenes.length&&s.scenes.every(x=>typeof x.id==='string'&&typeof x.title==='string'&&typeof x.html==='string'))}
try{const raw=localStorage.getItem(key);if(raw){const d=JSON.parse(raw);if(!valid(d))throw Error();data=d}}catch{readError=true}
const story=()=>data.stories.find(x=>x.id===data.story)||data.stories[0], scene=()=>story().scenes.find(x=>x.id===data.scene)||story().scenes[0];
let base;try{base=localStorage.getItem(key)}catch{}
function save(){try{if(readError||localStorage.getItem(key)!==base)throw Error();const value=JSON.stringify(data);localStorage.setItem(key,value);base=value;$('saved').textContent='● Saved on this device';return true}catch{$('saved').textContent='Unsaved · export a backup';notice('Draft could not be saved. Open Backups on the story shelf.')}}
function notice(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').hidden=true,4200)}
function count(){const n=(ed.innerText.match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length;$('count').textContent=n+' word'+(n===1?'':'s')}
function closePanels(){for(const el of document.querySelectorAll(':popover-open'))el.hidePopover()}
function openRoom(s){
 closePanels();
 data.story=s.id;
 data.scene=(s.scenes.find(v=>v.id===s.lastScene)||s.scenes.find(v=>v.id===data.scene)||s.scenes[0]).id;
 $('home').hidden=true;$('room').hidden=false;render();save();ed.focus();
}
function goHome(){
 closePanels();$('room').hidden=true;$('home').hidden=false;
 $('shelf').replaceChildren(...data.stories.map(storyRow));
}
function shelfChange(stories){
 const next=stories.find(s=>s.id===data.story)||stories[0];
 const previous=data;
 data={...data,stories,story:next?.id??null,scene:next?.scenes.find(s=>s.id===data.scene)?.id??next?.scenes[0].id??null};
 if(!save()){data=previous;return false}
 goHome();return true;
}
function moveStory(id,to){
 const stories=data.stories.slice(),from=stories.findIndex(s=>s.id===id);
 if(from<0||to<0||to>=stories.length||from===to)return;
 stories.splice(to,0,stories.splice(from,1)[0]);shelfChange(stories);
}
function storyActions(s){
 const actions=document.createElement('div');actions.className='storyActions';
 const add=(label,fn)=>{
  const btn=document.createElement('button');btn.type='button';btn.textContent=label;
  btn.onclick=()=>{actions.hidePopover();fn()};btn.setAttribute('aria-label',label+' · '+s.name);actions.append(btn);return btn;
 };
 add('Rename',()=>dialog('Rename story','','Save title',s.name,name=>shelfChange(data.stories.map(v=>v.id===s.id?{...v,name}:v))));
 add('Delete',()=>{dialog('Delete story?','This permanently deletes “'+s.name+'” and all its scenes from this browser.','Delete story',null,()=>shelfChange(data.stories.filter(v=>v.id!==s.id)));$('close').focus()}).className='danger';
 return actions;
}
function storyRow(s){
 const row=document.createElement('div'),grip=document.createElement('button'),open=document.createElement('button');
 row.className='storyTile';row.dataset.storyId=s.id;
 grip.className='storyGrip';grip.innerHTML='<span aria-hidden="true"></span>';grip.hidden=data.stories.length<2;
 grip.setAttribute('aria-label','Reorder '+s.name);grip.title='Drag to reorder, or use the arrow keys';
 grip.onkeydown=e=>{
  if(!['ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();moveStory(s.id,data.stories.indexOf(s)+(e.key==='ArrowUp'?-1:1));
  Array.from($('shelf').children).find(r=>r.dataset.storyId===s.id)?.querySelector('.storyGrip').focus();
 };
 grip.onpointerdown=e=>dragStory(e,grip,row,s.id);
 const title=document.createElement('strong'),info=document.createElement('small');
 open.className='openStory';title.textContent=s.name;info.textContent=s.scenes.length+(s.scenes.length===1?' scene':' scenes');
 open.append(title,info);open.onclick=()=>openRoom(s);
 const menu=document.createElement('button'),actions=storyActions(s);
 menu.className='storyOptions';menu.setAttribute('aria-label','Options for '+s.name);
 menu.innerHTML='<span aria-hidden="true"></span>';actions.popover='auto';menu.popoverTargetElement=actions;
 actions.addEventListener('beforetoggle',e=>{
  if(e.newState!=='open')return;
  const rect=menu.getBoundingClientRect();
  actions.style.left=Math.max(4,Math.min(innerWidth-144,rect.right-140))+'px';
  actions.style.top=(rect.bottom+110<innerHeight?rect.bottom+4:Math.max(4,rect.top-96))+'px';
 });
 row.append(grip,open,menu,actions);return row;
}
function dragStory(event,grip,row,id){
 if(!event.isPrimary||event.button!==0)return;
 const pointer=event.pointerId,others=Array.from($('shelf').children).filter(r=>r!==row);
 if(!others.length)return;
 let y=event.clientY,target=data.stories.findIndex(s=>s.id===id),frame=0,moved=false;
 grip.setPointerCapture(pointer);
 function preview(){
  if(!moved)return;
  const scroll=y<50?-10:y>innerHeight-50?10:0;
  if(scroll)window.scrollBy(0,scroll);
  target=others.findIndex(r=>{const b=r.getBoundingClientRect();return y<b.top+b.height/2});
