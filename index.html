header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,84px);background:var(--panel)}.brand{font:italic bold 37px Georgia;letter-spacing:-2.5px;display:flex;align-items:center;gap:11px}.mark{width:33px;height:36px;display:inline-block;position:relative}.mark:before,.mark:after{content:"";position:absolute;inset:5px 8px 4px 3px;border-radius:3px 8px 4px 2px;background:var(--wine);transform:rotate(-13deg)}.mark:after{transform:rotate(12deg);left:11px;right:1px;background:var(--soft);border:1px solid var(--wine)}.flex{display:flex;align-items:center;gap:8px}.pill,select{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:8px 14px}.shell{max-width:1450px;margin:0 auto;padding:36px clamp(16px,5vw,84px);display:grid;grid-template-columns:245px minmax(0,1fr);gap:28px}.rail{display:flex;flex-direction:column;gap:16px}.card,article{border:1px solid var(--line);background:var(--panel);border-radius:24px;box-shadow:var(--shadow)}.card{padding:20px}.label{font:600 10px system-ui;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h2{font:24px Georgia;margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.stories{width:100%;margin:15px 0 8px;min-width:0}.create{width:100%;background:var(--soft);color:var(--wine);font-weight:600}.sceneList{display:grid;gap:3px;margin-top:14px}.sceneList button{display:flex;gap:10px;text-align:left;align-items:baseline;overflow-wrap:anywhere}.sceneList small{font:11px monospace;color:var(--muted)}.selected{background:var(--soft);color:var(--wine)}.music{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--wash),var(--panel));padding-top:19px}.disc{width:80px;height:80px;margin:5px auto 14px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 2px,#46374219 3px 4px),conic-gradient(#a49daa,#ededed,#cba6b0,#aecec9,#ece2ba,#afacc0,#f6ddd2,#a49daa);box-sha <script>
'use strict';
const $=id=>document.getElementById(id), ed=$('editor'), modal=$('modal'), uid=()=>crypto.randomUUID(), key='folio.workspace.v1:'+location.pathname;
function freshScene(title=''){return {id:uid(),title,html:''}}
function freshStory(name){return {id:uid(),name,scenes:[freshScene()]}}
let data={stories:[],story:null,scene:null}, readError=false;
function valid(d){return d&&Array.isArray(d.stories)&&d.stories.every(s=>typeof s.name==='string'&&typeof s.id==='string'&&Array.isArray(s.scenes)&&s.scenes.length&&s.scenes.every(x=>typeof x.id==='string'&&typeof x.title==='string'&&typeof x.html==='string'))}
try{const raw=localStorage.getItem(key);if(raw){const d=JSON.parse(raw);if(!valid(d))throw Error();data=d}}catch{readError=true}
const story=()=>data.stories.find(x=>x.id===data.story)||data.stories[0], scene=()=>story().scenes.find(x=>x.id===data.scene)||story().scenes[0];
let base;try{base=localStorage.getItem(key)}catch{}
function save(){try{if(readError||localStorage.getItem(key)!==base)throw Error();const value=JSON.stringify(data);localStorage.setItem(key,value);base=value;$('saved').textContent='● Saved on this device'}catch{$('saved').textContent='Unsaved · export a backup';notice('Draft could not be saved. Open Backups on the story shelf.')}}
function notice(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').hidden=true,4200)}
function count(){const n=(ed.innerText.match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length;$('count').textContent=n+' word'+(n===1?'':'s')}
function closePanels(){for(const el of document.querySelectorAll(':popover-open'))el.hidePopover()}
function openRoom(s){
 closePanels();
 data.story=s.id;
 data.scene=(s.scenes.find(v=>v.id===s.lastScene)||s.scenes.find(v=>v.id===data.scene)||s.scenes[0]).id;
 $('home').hidden=true;$('room').hidden=false;render();save();ed.focus();
}
function goHome(){
 closePanels();$('room').hidden=true;$('home').hidden=false;
 $('shelf').replaceChildren(...data.stories.map(s=>{
  const button=document.createElement('button'),title=document.createElement('strong'),info=document.createElement('small');
  button.className='storyTile';title.textContent=s.name;info.textContent=s.scenes.length+(s.scenes.length===1?' scene':' scenes');
  button.append(title,info);button.onclick=()=>openRoom(s);return button;
 }));
}
function render(){
 const s=story();s.lastScene=scene().id;$('currentStory').textContent=s.name;
 $('scenes').replaceChildren(...s.scenes.map((v,i)=>{
  const b=document.createElement('button');b.textContent=v.title||'Scene '+(i+1);
  if(v===scene())b.className='selected';
  b.onclick=()=>{data.scene=v.id;closePanels();render();save();ed.focus()};return b;
 }));
 ed.innerHTML=scene().html;count();updateTools();
}
$('homeBtn').onclick=()=>{goHome();$('create').focus()};
$('rename').onclick=()=>{closePanels();dialog('Rename scene','','Save',scene().title,name=>{scene().title=name;render();save();ed.focus()})};
ed.oninput=()=>{scene().html=ed.innerHTML;count();save()};
function dialog(title,detail,label,initial,action){$('heading').textContent=title;$('detail').textContent=detail;$('extra').replaceChildren();$('field').hidden=initial===null;$('field').placeholder='';$('field').value=initial||'';$('field').required=initial!==null;$('submit').textContent=label;$('submit').hidden=!action;$('form').onsubmit=e=>{e.preventDefault();if(action){const value=$('field').value.trim();if(initial!==null&&!value)return;modal.close();action(value)}};modal.showModal();if(initial!==null){$('field').focus();$('field').select()}}
$('close').onclick=()=>modal.close();$('create').onclick=()=>dialog('Create story','Give this story a working title.','Create','',name=>{const s=freshStory(name);data.stories.push(s);openRoom(s)});$('addScene').onclick=()=>dialog('New scene','Each scene gets its own writing space.','Add scene','Scene '+(story().scenes.length+1),name=>{const s=freshScene(name);story().scenes.push(s);data.scene=s.id;closePanels();render();save();ed.focus()});
let dark=matchMedia('(prefers-color-scheme: dark)').matches;try{dark=(localStorage.getItem('folio.theme')||String(dark))==='true'}catch{}function theme(){document.documentElement.classList.toggle('dark',dark);$('theme').textContent=dark?'☀':'☾'}theme();$('theme').onclick=()=>{dark=!dark;theme();try{localStorage.setItem('folio.theme',dark)}catch{}};
for(const [label,cmd] of [['left','justifyLeft'],['center','justifyCenter'],['right','justifyRight'],['justify','justifyFull']]){const b=document.createElement('button');b.dataset.cmd=cmd;b.title=b.ariaLabel='Align '+label;b.innerHTML='<span class="align '+label+'"><i></i><i></i><i></i><i></i></span>';$('alignTools').append(b)}
function updateTools(){for(const b of document.querySelectorAll('[data-cmd]'))b.setAttribute('aria-pressed',String(ed.contains(getSelection()?.anchorNode)&&document.queryCommandState(b.dataset.cmd)))}
$('formatToggle').onmousedown=e=>e.preventDefault();
document.addEventListener('selectionchange',updateTools);$('tools').onmousedown=e=>e.preventDefault();
$('tools').onclick=e=>{const cmd=e.target.closest('[data-cmd]')?.dataset.cmd;if(cmd){ed.focus();document.execCommand(cmd);updateTools()}};
$('breakBtn').onclick=()=>{ed.focus();document.execCommand('insertHTML',false,'<p style="text-align:center">⁂</p><p><br></p>')};
ed.addEventListener('beforeinput',e=>{if(e.inputType!=='insertText'||e.isComposing||!["'",'"'].includes(e.data))return;const sel=getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0).cloneRange();const block=r.startContainer.parentElement?.closest('p,div,li,blockquote')||ed;r.setStart(block,0);const opening=!r.toString()||/[\s([{—]$/u.test(r.toString());e.preventDefault();document.execCommand('insertText',false,e.data==="'"?(opening?'‘':'’'):(opening?'“':'”'))});
</script>
<script>
const escapeHtml=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function clean(html){
 const src=document.createElement('template');src.innerHTML=html;
 const blocks=new Set('P DIV ARTICLE SECTION MAIN HEADER FOOTER BLOCKQUOTE H1 H2 H3 H4 H5 H6 UL OL LI PRE'.split(' '));
 function visit(n,pre=false){
  if(n.nodeType===3){const text=escapeHtml(n.data);return pre?text.replace(/\r?\n/g,'<br>'):text}
  if(n.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|IMG|BUTTON|INPUT|SVG|MATH|TEMPLATE|NOSCRIPT)$/.test(n.tagName))return '';
  if(n.tagName==='BR')return '<br>';
  const st=n.style;let inner=Array.from(n.childNodes,c=>visit(c,pre||n.tagName==='PRE'||/^pre/.test(st.whiteSpace))).join('');
  if(/^(B|STRONG)$/.test(n.tagName)||st.fontWeight==='bold'||parseInt(st.fontWeight)>=600)inner='<strong>'+inner+'</strong>';
  if(/^(I|EM)$/.test(n.tagName)||st.fontStyle==='italic')inner='<em>'+inner+'</em>';
  if(n.tagName==='U'||(st.textDecoration+st.textDecorationLine).includes('underline'))inner='<u>'+inner+'</u>';
  if(blocks.has(n.tagName)){const t=/^(ARTICLE|SECTION|MAIN|HEADER|FOOTER)$/.test(n.tagName)?'div':n.tagName.toLowerCase();const align=st.textAlign||n.getAttribute('align');return '<'+t+(/^(left|right|center|justify)$/.test(align)?' style="text-align:'+align+'"':'')+'>'+inner+'</'+t+'>'}
  return inner
 }
 return Array.from(src.content.childNodes,n=>visit(n)).join('')
}
function plainRich(s){return s.replace(/\r\n?/g,'\n').split('\n').map(line=>{let html=escapeHtml(line).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');return '<div>'+(html||'<br>')+'</div>'}).join('')}
ed.onpaste=e=>{e.preventDefault();const c=e.clipboardData;const h=c.getData('text/html');document.execCommand('insertHTML',false,h?clean(h):plainRich(c.getData('text/plain')))};
ed.ondrop=e=>e.preventDefault();
$('copy').onclick=async()=>{if(!ed.innerText.trim()){notice('This scene is empty');return}try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([clean(ed.innerHTML)],{type:'text/html'}),'text/plain':new Blob([ed.innerText],{type:'text/plain'})})]);notice('Scene copied with formatting')}catch{ed.focus();const r=document.createRange();r.selectNodeContents(ed);getSelection().removeAllRanges();getSelection().addRange(r);notice(document.execCommand('copy')?'Scene copied':'Scene selected · press Ctrl/Cmd+C')}};
function download(){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.href=url;a.download='folio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('backups').onclick=()=>{dialog('Story backups','Drafts live in this browser. Download all stories or import a backup as additional stories.', '',null,null);const down=document.createElement('button');down.type='button';down.className='pill';down.textContent='Download backup';down.onclick=download;const input=document.createElement('input');input.type='file';input.accept='.json';input.ariaLabel='Import backup';input.onchange=async()=>{try{const d=JSON.parse(await input.files[0].text());if(!valid(d))throw Error();if(!d.stories.length){notice('This backup has no stories');return}const items=d.stories.map(s=>({id:uid(),name:s.name,scenes:s.scenes.map(x=>({id:uid(),title:x.title,html:clean(x.html)}))}));data.stories.push(...items);data.story=items[0].id;data.scene=items[0].scenes[0].id;save();modal.close();goHome();notice('Backup imported')}catch{notice('Could not read this backup')}};$('extra').append(down,input)};
goHome();$('saved').textContent=readError?'Storage unavailable · use Backups':'● Saved on this device';
</script><script>
const redirect=location.origin+location.pathname, api='https://api.spotify.com/v1/me/player/currently-playing', tokenURL='https://accounts.spotify.com/api/token', sessionKey='folio.spotify:'+location.pathname;
let session={};try{session=JSON.parse(sessionStorage.getItem(sessionKey)||'{}')}catch{}
function persist(){sessionStorage.setItem(sessionKey,JSON.stringify(session))}
function music(name,by,playing=false,url='',art=''){const cover=$('cover');if(art){if(cover.getAttribute('src')!==art){cover.hidden=true;cover.onload=()=>cover.hidden=false;cover.onerror=()=>cover.hidden=true;cover.src=art}}else{cover.removeAttribute('src');cover.hidden=true} $('track').textContent=name;$('artist').textContent=by;$('disc').classList.toggle('playing',playing);$('trackLink').hidden=!url;if(url)$('trackLink').href=url;$('spotify').textContent=session.access?'Disconnect Spotify':'Connect Spotify'}
const enc=bytes=>btoa(String.fromCharCode(...bytes)).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
$('spotify').onclick=()=>{if(session.access){session={};persist();clearTimeout(pollTimer);music('Quiet room','Spotify is disconnected');return}
 if(location.protocol!=='https:'&&location.hostname!=='127.0.0.1'){dialog('Connect Spotify','Open Folio on its HTTPS GitHub Pages address to connect.','',null,null);return}
 dialog('Connect Spotify','In your Spotify developer dashboard, create a Web API app and register the exact redirect address below. Enter its public Client ID here. Development-mode app owners need Spotify Premium.','Connect','',async id=>{try{if(!/^[a-f\d]{32}$/i.test(id)){notice('Enter the 32-character Client ID');return}const verifier=enc(crypto.getRandomValues(new Uint8Array(48))),state=uid(),challenge=enc(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))));session={id,verifier,state};persist();location.assign('https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:id,response_type:'code',scope:'user-read-currently-playing',redirect_uri:redirect,state,code_challenge_method:'S256',code_challenge:challenge}))}catch{notice('Spotify setup needs browser session storage')}});$('field').placeholder='Client ID';const p=document.createElement('p');p.textContent=redirect;const a=document.createElement('a');a.href='https://developer.spotify.com/dashboard';a.target='_blank';a.rel='noopener';a.textContent='Open Spotify dashboard ↗';$('extra').append(p,a)};
async function token(params){const current=session;const response=await fetch(tokenURL,{method:'POST',body:new URLSearchParams({...params,client_id:current.id})});if(!response.ok)throw Error('authorization');const t=await response.json();if(session!==current)return;Object.assign(session,{access:t.access_token,refresh:t.refresh_token||session.refresh,expires:Date.now()+t.expires_in*1000});delete session.verifier;delete session.state;persist()}
let pollTimer=0;
async function poll(){clearTimeout(pollTimer);if(!session.access||document.hidden)return;let delay=12000;const current=session;try{if(Date.now()>session.expires-30000)await token({grant_type:'refresh_token',refresh_token:session.refresh});if(session!==current)return;const r=await fetch(api,{headers:{Authorization:'Bearer '+session.access}});if(session!==current)return;
 if(r.status===204)music('Nothing playing','Start a track in Spotify');else if(r.status===429){delay=Math.max(30,Number(r.headers.get('Retry-After'))||30)*1000;music('Taking a moment','Spotify asked us to retry later')}else if(r.status===403){music('Access unavailable','Check Premium and app user access');return}else if(r.status===401)throw Error('authorization');else if(!r.ok)throw Error('network');else{const x=await r.json();if(session!==current)return;music(x.item?.name||'Nothing playing',x.item?.artists?.map(a=>a.name).join(', ')||'Spotify',!!(x.item&&x.is_playing),x.item?.external_urls?.spotify,x.item?.album?.images?.at(-1)?.url||x.item?.images?.at(-1)?.url)}}catch(e){if(session!==current)return;if(e.message==='authorization'){session={};persist();music('Reconnect Spotify','Your authorization expired');return}music('Spotify unavailable','Trying again shortly');delay=30000}if(session===current)pollTimer=setTimeout(poll,delay)}
async function initMusic(){const q=new URLSearchParams(location.search);if(q.has('code')||q.has('error')){history.replaceState(null,'',location.pathname+location.hash);try{if(q.has('error')||!session.state||q.get('state')!==session.state)throw Error();await token({grant_type:'authorization_code',code:q.get('code'),redirect_uri:redirect,code_verifier:session.verifier})}catch{session={};persist();music('Connection incomplete','Connect again when ready');return}}if(session.access)await poll()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(pollTimer);else poll()});initMusic();
</script></body></html>
